[versions]
agp = "9.1.1"
kotlin = "2.2.10"
ksp = "2.3.12"
compose = "2026.09.00"
activity = "1.13.0"
lifecycle = "2.10.0"
core = "1.18.0"
datastore = "1.2.0"
work = "2.12.0"
room = "2.8.5"
