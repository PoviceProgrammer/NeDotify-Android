tasks.register('resolveAndLockDependencies') {
    description = 'Resolve dependencies for lock/checksum refresh without packaging.'
    doLast {
        // AGP also exposes internal resolvable configurations with incomplete
        // attributes; resolving those as a library is ambiguous. Lock the
        // actual compile/runtime dependency graphs for both shipped variants.
        configurations.findAll { it.canBeResolved &&
            it.name ==~ /(?:debug|release)(?:Compile|Runtime)Classpath/ }.each { it.resolve() }
    }
}

