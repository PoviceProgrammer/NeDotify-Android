name: Android source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      cold_cache:
        description: Run the mandatory final cold-cache compile
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: android-source-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep builds within a bounded memory/worker budget. This is CI-scoped and
  # does not rewrite developer machine settings or dependency verification.
  GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process -Dorg.gradle.workers.max=1

jobs:
  policy:
    name: Source policy and generated tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify generated tokens
        shell: pwsh
        run: ./tools/generate-design-tokens.ps1 -Check
      - name: Exercise source gate policy and drift detection
        shell: pwsh
        run: ./tools/test-source-infrastructure.ps1
      - name: Verify dependency catalog and locks
        shell: pwsh
        run: ./tools/check-catalog-lock.ps1
      - name: Verify the committed source snapshot
        shell: pwsh
        run: ./review/VERIFY.ps1

  build:
    name: Kotlin, JVM, lint and instrumentation compilation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Run the five explicit source tasks without APK packaging
        shell: pwsh
        run: ./tools/run-source-build.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-source-evidence
          path: |
            app/build/reports/
            app/build/test-results/

  dependency-plan:
    name: Determine cold-cache requirement
    runs-on: ubuntu-latest
    outputs:
      cold: ${{ steps.plan.outputs.cold }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          MANUAL_COLD: ${{ inputs.cold_cache }}
        run: |
          set -euo pipefail
          cold=false
          if [[ "$EVENT_NAME" == workflow_dispatch && "$MANUAL_COLD" == true ]]; then
            cold=true
          elif [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            cold=true
          elif git diff --name-only "$BASE_SHA" HEAD -- gradle app/build.gradle build.gradle settings.gradle buildscript-gradle.lockfile settings-gradle.lockfile app/gradle.lockfile .github/workflows/android-source.yml tools/run-source-build.ps1 tools/SourceTasks.ps1 | grep -q .; then
            cold=true
          fi
          echo "cold=$cold" >> "$GITHUB_OUTPUT"

  cold:
    name: Cold-cache Kotlin compile and dependency verification
    needs: dependency-plan
    if: needs.dependency-plan.outputs.cold == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0'
      - name: Compile with an empty Gradle home and strict dependency verification
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/gradle-home-cold
        run: bash ./gradlew --console=plain --dependency-verification strict :app:compileDebugKotlin

  source:
    name: android/source
    if: always()
    needs: [policy, build, dependency-plan, cold]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject failed or skipped mandatory jobs
        shell: pwsh
        env:
          SOURCE_JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          . ./tools/SourceGatePolicy.ps1
          Assert-SourceJobResults ($env:SOURCE_JOB_RESULTS | ConvertFrom-Json)
          Write-Output 'All mandatory source checks succeeded. APK/device/visual checks remain NOT_RUN.'

# APK packaging, installation and instrumentation execution are deliberately
# absent while AGENTS.md forbids APK builds. No workflow input bypasses this.
